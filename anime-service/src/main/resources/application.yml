  application:
    name: anime-service
  threads:
    virtual:
      enabled: true #para ativar o uso de threads virtuais
logging:
  level:
    academy.devdojo: debug
server:
  servlet:
    context-path: /
  error:
    include-stacktrace: ON_PARAM
  tomcat:
    threads:
      max: 20 #20 clientes fazem requisição, o vigésimo primeiro tem que esperar | por padrao tem 200 threads

database:
  url: ${DB_URL:localhost}:${DB_PORT:3306}
  username: ${LOCAL_USERNAME:ruan2} #: seta um valor padrao
  password: ${LOCAL_PASSWORD:ruandb2} #bom definir um PADRÃO ao executar e apenas em casos especificos troca o profile (MONGO)

